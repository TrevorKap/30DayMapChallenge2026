<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same Clock, Different Dawn</title>
<meta name="description" content="Animated world map of the local clock time of sunrise through 2026, showing how sunrise runs late on the western edge of every time zone and early on the eastern edge.">
<meta property="og:type" content="website">
<meta property="og:title" content="Same Clock, Different Dawn">
<meta property="og:description" content="The clock time of sunrise across the world for every day of 2026. Inside each time zone, the eastern edge sees sunrise early and the western edge sees it late.">
<meta property="og:url" content="https://trevorkap.github.io/30DayMapChallenge2026/sunrise-clock-skew/">
<meta property="og:image" content="https://trevorkap.github.io/30DayMapChallenge2026/sunrise-clock-skew/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230B0F14'/%3E%3Crect y='9' width='16' height='7' fill='%23E39A3B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0E141B; --ink:#ECE6D8; --mute:#9AA3AF; --rule:#2A323D; --accent:#E39A3B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
#map{position:fixed;inset:0}
#map canvas,#map svg{position:absolute;inset:0}
svg text{font:500 12px "IBM Plex Sans",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round}
svg text .t{font:500 12px "IBM Plex Mono",monospace;fill:var(--accent)}
svg text.gap{font:500 11px "IBM Plex Mono",monospace;fill:var(--ink)}
svg .pair{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;fill:none;opacity:.75}
svg circle{fill:var(--sea);stroke:var(--ink);stroke-width:1.5}

/* key sits straight on the map over the South Pacific; halo instead of a panel */
#key{position:fixed;left:32px;bottom:76px;width:min(330px,22vw);text-shadow:0 0 2px var(--sea),0 0 6px var(--sea)}
h1{font:600 30px/1.08 "Source Serif 4",Georgia,serif;letter-spacing:-.01em;margin-bottom:8px}
#key p{color:var(--mute);margin-bottom:18px}
.datebar{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
#date{font:500 26px "IBM Plex Mono",monospace}
#play{font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;background:none;color:var(--mute);border:0;border-bottom:1px solid currentColor;padding:0;cursor:pointer}
#play:hover,#play:focus-visible{color:var(--ink);outline:none}
.lk{font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:6px}
#ramp{display:flex;height:10px}
#ramp span{flex:1}
#rampLab{display:flex;justify-content:space-between;font:11px "IBM Plex Mono",monospace;color:var(--mute);margin-top:3px}
#extra{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:8px}
#extra i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:6px;outline:1px solid var(--rule)}

/* timeline runs along the bottom edge of the map */
#timeline{position:fixed;left:32px;right:32px;bottom:14px}
#day{display:block;width:100%;accent-color:var(--accent);cursor:pointer}
#months{position:relative;height:16px;font:11px "IBM Plex Mono",monospace;color:var(--mute);text-shadow:0 0 4px var(--sea)}
#months span{position:absolute;top:0}

#tip{position:fixed;pointer-events:none;background:var(--sea);border:1px solid var(--ink);padding:10px 12px;min-width:200px;display:none}
#tip h2{font:500 12px "IBM Plex Sans",sans-serif;color:var(--mute)}
#tip b{display:block;font:500 22px "IBM Plex Mono",monospace;margin:2px 0 8px}
#tip dl{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:12px}
#tip dt{color:var(--mute)}
#tip dd{font-family:"IBM Plex Mono",monospace;text-align:right}

@media (max-width:720px){
  #key{left:16px;right:16px;width:auto;bottom:64px}
  #timeline{left:16px;right:16px}
  h1{font-size:22px}
  #key p,svg text{display:none}
}
</style>
</head>
<body>
<div id="map" role="img" aria-label="World map coloured by the local clock time of sunrise on the selected day of 2026"><canvas></canvas><svg></svg></div>

<section id="key" aria-label="Map key">
  <h1>Same clock, different dawn</h1>
  <p>A time zone gives a whole region one clock, but the sun still rises from east to west. Inside each zone, the eastern edge sees sunrise early and the western edge sees it late.</p>
  <div class="datebar"><span id="date" aria-live="off"></span><button id="play" type="button" aria-pressed="true">Pause</button></div>
  <div class="lk">Sunrise, local clock time</div>
  <div id="ramp"></div>
  <div id="rampLab"><span>03:00</span><span>05:00</span><span>07:00</span><span>09:00</span><span>10:00+</span></div>
  <div id="extra"><span><i id="kNight"></i>Polar night</span><span><i id="kSun"></i>Midnight sun</span></div>
</section>
<div id="timeline"><input id="day" type="range" min="0" max="364" step="1" aria-label="Day of 2026"><div id="months" aria-hidden="true"></div></div>
<div id="tip" role="status"><h2></h2><b></b><dl></dl></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const RAD = Math.PI / 180, ZEN = Math.cos(90.833 * RAD);
const T0 = 180, STEP = 30, NB = 14; // bands: 03:00 to 10:00 in 30 min steps
const ramp = d3.piecewise(d3.interpolateLab, ["#F6E7B8", "#E39A3B", "#A8443E", "#2E3F66", "#1A2236"]);
const BAND = d3.range(NB).map(i => ramp(i / (NB - 1)));
const NIGHT = "#121821", MSUN = "#FBF6EA", SEA = "#0E141B";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PAIRS = [
  ["Beijing time", ["Ürümqi", 43.83, 87.62], ["Shanghai", 31.23, 121.47]],
  ["Central Europe", ["Madrid", 40.42, -3.70], ["Warsaw", 52.23, 21.01]],
  ["India", ["Mumbai", 19.08, 72.88], ["Kolkata", 22.57, 88.36]],
  ["US Eastern", ["Detroit", 42.33, -83.05], ["New York", 40.71, -74.0]],
];

// pack a CSS color as little-endian RGBA uint32 for ImageData
const pack = c => { const r = d3.rgb(c); return (255 << 24 | r.b << 16 | r.g << 8 | r.r) >>> 0; };
const BANDP = Uint32Array.from(BAND, pack), NIGHTP = pack(NIGHT), MSUNP = pack(MSUN), SEAP = pack(SEA), LINEP = pack("#07090C");

// NOAA low-precision solar position, day = 0 for 1 Jan
function sun(day) {
  const g = 2 * Math.PI / 365 * day;
  return {
    eqt: 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g)),
    decl: 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g),
  };
}
// hour angle of sunrise in degrees, or -1 polar night, -2 midnight sun
function hourAngle(lat, decl) {
  const c = ZEN / (Math.cos(lat * RAD) * Math.cos(decl)) - Math.tan(lat * RAD) * Math.tan(decl);
  return c > 1 ? -1 : c < -1 ? -2 : Math.acos(c) / RAD;
}
const wrap = m => ((m % 1440) + 1440) % 1440;
const hhmm = m => { m = Math.round(wrap(m)); return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const dur = m => { const s = m < 0 ? "-" : "+"; m = Math.round(Math.abs(m)); return s + (m / 60 | 0) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const utc = m => "UTC" + (m < 0 ? "-" : "+") + (Math.abs(m) / 60 | 0) + (m % 60 ? ":" + String(Math.abs(m) % 60).padStart(2, "0") : "");
const fmtDate = d => { const t = new Date(Date.UTC(2026, 0, 1 + d)); return t.getUTCDate() + " " + t.toLocaleString("en-GB", { month: "long", timeZone: "UTC" }); };

(async function () {
  const [meta, img] = await Promise.all([
    fetch("data/tz.json").then(r => r.json()),
    new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = "data/tz.png"; }),
  ]);
  const RES = meta.res, GW = img.width, GH = img.height, zones = meta.zones;
  const tmp = document.createElement("canvas"); tmp.width = GW; tmp.height = GH;
  const tctx = tmp.getContext("2d"); tctx.drawImage(img, 0, 0);
  const px = tctx.getImageData(0, 0, GW, GH).data, grid = new Uint16Array(GW * GH);
  for (let i = 0; i < grid.length; i++) grid[i] = px[i * 4] | px[i * 4 + 1] << 8;
  const cellLon = Float64Array.from({ length: GW }, (_, c) => (c + 0.5) / RES - 180);
  const rowLat = Float64Array.from({ length: GH }, (_, r) => 90 - (r + 0.5) / RES);
  const cellOf = (lat, lon) => Math.min(GH - 1, (90 - lat) * RES | 0) * GW + Math.min(GW - 1, (lon + 180) * RES | 0);

  // per-day offset (minutes) for every zone, index 0 = sea
  const offDay = zones.map(z => { const a = new Int16Array(365); let k = 0; for (let d = 0; d < 365; d++) { while (k + 1 < z.off.length && z.off[k + 1][0] <= d) k++; a[d] = z.off[k][1]; } return a; });
  const zoff = new Int16Array(zones.length + 1);

  // sunrise at a cell: local clock minutes, or -1/-2 polar codes
  function sunriseAt(c, day, s) {
    const z = grid[c]; if (!z) return null;
    const ha = hourAngle(rowLat[c / GW | 0], s.decl), off = offDay[z - 1][day], lon = cellLon[c % GW];
    return { z, off, ha, rise: ha < 0 ? ha : wrap(720 - 4 * (lon + ha) - s.eqt + off), noon: 720 - 4 * lon - s.eqt + off };
  }

  const mapEl = document.getElementById("map"), canvas = mapEl.querySelector("canvas"), ctx = canvas.getContext("2d");
  // Mercator centred on 10E fills a widescreen frame edge to edge between about 75N and 58S
  const svg = d3.select(mapEl).select("svg");
  const proj = d3.geoMercator().rotate([-10, 0]);
  let W = 0, H = 0, lut, pzone, image, buf, day = 0;
  const cellColor = new Uint32Array(GW * GH), rowHA = new Float64Array(GH);

  function layout() {
    W = mapEl.clientWidth; H = mapEl.clientHeight;
    if (W < 50 || H < 50) return false;
    canvas.width = W; canvas.height = H; svg.attr("width", W).attr("height", H);
    proj.scale(W / (2 * Math.PI)).translate([W / 2, 0]);
    const mid = (proj([10, 75])[1] + proj([10, -58])[1]) / 2;
    proj.translate([W / 2, (W <= 720 ? H * 0.36 : H / 2) - mid]);
    lut = new Int32Array(W * H).fill(-1); pzone = new Uint16Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ll = proj.invert([x + 0.5, y + 0.5]); if (!ll) continue;
      const back = proj(ll);
      if (!back || Math.abs(back[0] - x - 0.5) > 0.5 || Math.abs(back[1] - y - 0.5) > 0.5 || ll[1] > 85 || ll[1] < -60) continue;
      const c = cellOf(ll[1], ll[0]); lut[y * W + x] = c; pzone[y * W + x] = grid[c];
    }
    image = ctx.createImageData(W, H); buf = new Uint32Array(image.data.buffer);
    drawSvg();
    return true;
  }

  function render() {
    if (!buf) return;
    const s = sun(day);
    for (let r = 0; r < GH; r++) rowHA[r] = hourAngle(rowLat[r], s.decl);
    for (let z = 0; z < zones.length; z++) zoff[z + 1] = offDay[z][day];
    for (let r = 0, c = 0; r < GH; r++) {
      const ha = rowHA[r], k = 720 - 4 * ha - s.eqt + 2880 - T0; // +2880 keeps t positive before the mod
      for (let col = 0; col < GW; col++, c++) {
        const z = grid[c]; if (!z) continue;
        if (ha < 0) { cellColor[c] = ha === -1 ? NIGHTP : MSUNP; continue; }
        const b = ((k - 4 * cellLon[col] + zoff[z]) % 1440) / STEP | 0;
        cellColor[c] = BANDP[b < NB ? b : (b > 36 ? 0 : NB - 1)]; // b > 36: before 03:00 wraps past 21:00
      }
    }
    for (let p = 0; p < buf.length; p++) {
      const c = lut[p];
      const z = c < 0 ? 0 : pzone[p];
      if (!z) { buf[p] = SEAP; continue; }
      const zr = pzone[p + 1], zd = pzone[p + W];
      buf[p] = (zr && zoff[zr] !== zoff[z]) || (zd && zoff[zd] !== zoff[z]) ? LINEP : cellColor[c];
    }
    ctx.putImageData(image, 0, 0);
    updateCard(s);
  }

  // svg overlay: city pairs labelled with their live sunrise time, gap on the connector
  const gPairs = svg.append("g");
  const at = d => proj([d[2], d[1]]);
  function drawSvg() {
    const g = gPairs.selectAll("g").data(PAIRS).join(e => {
      const g = e.append("g");
      g.append("path").attr("class", "pair");
      g.append("text").attr("class", "gap").attr("text-anchor", "middle");
      g.selectAll("circle").data(d => [d[1], d[2]]).join("circle").attr("r", 3.5);
      g.selectAll("text.city").data(d => [d[1], d[2]]).join(e => { const t = e.append("text").attr("class", "city").attr("text-anchor", (d, i) => i ? "start" : "end"); t.append("tspan").attr("class", "n"); t.append("tspan").attr("class", "t").attr("dx", 5); return t; });
      return g;
    });
    g.select("path").attr("d", d => d3.geoPath(proj)({ type: "LineString", coordinates: [[d[1][2], d[1][1]], [d[2][2], d[2][1]]] }));
    g.select("text.gap").attr("x", d => (at(d[1])[0] + at(d[2])[0]) / 2).attr("y", d => (at(d[1])[1] + at(d[2])[1]) / 2 + 18);
    g.selectAll("circle").attr("cx", d => at(d)[0]).attr("cy", d => at(d)[1]);
    g.selectAll("text.city").attr("x", (d, i) => at(d)[0] + (i ? 7 : -7)).attr("y", d => at(d)[1] + 4).select(".n").text(d => d[0]);
  }

  const dateEl = document.getElementById("date"), slider = document.getElementById("day"), playBtn = document.getElementById("play");
  d3.select("#months").selectAll("span").data(MONTHS).join("span").text(d => d[0])
    .style("left", (d, i) => (Date.UTC(2026, i, 1) - Date.UTC(2026, 0, 1)) / 864e5 / 364 * 100 + "%");
  d3.select("#ramp").selectAll("span").data(BAND).join("span").style("background", d => d);
  document.getElementById("kNight").style.background = NIGHT;
  document.getElementById("kSun").style.background = MSUN;

  const cityRise = (city, s) => sunriseAt(cellOf(city[1], city[2]), day, s);
  function updateCard(s) {
    dateEl.textContent = fmtDate(day);
    slider.value = day;
    gPairs.selectAll("g").each(function (d) {
      const a = cityRise(d[1], s), b = cityRise(d[2], s), g = d3.select(this);
      g.selectAll("text.city .t").text((c, i) => hhmm((i ? b : a).rise));
      g.select("text.gap").text(dur(a.rise - b.rise).slice(1).replace(/^0h /, "") + " apart");
    });
  }

  // animation: one day every 70 ms, wraps at year end
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playing = !reduce, last = 0;
  const now = new Date(); day = now.getUTCFullYear() === 2026 ? Math.min(364, Math.floor((now - Date.UTC(2026, 0, 1)) / 864e5)) : 171;
  function setPlaying(v) { playing = v; playBtn.textContent = v ? "Pause" : "Play"; playBtn.setAttribute("aria-pressed", v); }
  setPlaying(playing);
  playBtn.onclick = () => setPlaying(!playing);
  slider.oninput = () => { day = +slider.value; setPlaying(false); render(); };
  function tick(t) {
    if (playing && t - last > 70) { last = t; day = (day + 1) % 365; render(); }
    requestAnimationFrame(tick);
  }

  // tooltip
  const tip = document.getElementById("tip");
  mapEl.addEventListener("pointermove", e => {
    const x = e.clientX | 0, y = e.clientY | 0, c = lut && lut[y * W + x];
    const s = sun(day), v = c >= 0 ? sunriseAt(c, day, s) : null;
    if (!v) { tip.style.display = "none"; return; }
    const id = zones[v.z - 1].id;
    tip.querySelector("h2").textContent = id.split("/").pop().replace(/_/g, " ") + " time, " + utc(v.off);
    tip.querySelector("b").textContent = v.ha === -1 ? "No sunrise" : v.ha === -2 ? "Sun stays up" : "Sunrise " + hhmm(v.rise);
    const kv = [["Solar noon", hhmm(v.noon)], ["Clock vs sun", dur(v.noon - 720)]];
    if (v.ha >= 0) kv.push(["Daylight", dur(8 * v.ha).slice(1)]);
    tip.querySelector("dl").innerHTML = kv.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join("");
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(x + 16, innerWidth - tw - 8) + "px";
    tip.style.top = Math.max(8, Math.min(y + 16, innerHeight - th - 8)) + "px";
  });
  mapEl.addEventListener("pointerleave", () => tip.style.display = "none");

  // ponytail: 1x canvas (no devicePixelRatio) keeps the per-frame loop near 1M pixels; the 0.25 deg grid is coarser than a pixel anyway
  if (layout()) render();
  new ResizeObserver(() => { if (mapEl.clientWidth !== W || mapEl.clientHeight !== H) { if (layout()) render(); } }).observe(mapEl);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
