<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Portland Palate</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@500&display=swap">
<style>
:root{--bg:#0d1115;--water:#1d2f42;--ink:#e9e4da;--mute:#8d96a0;
--spicy:#d4492c;--sweet:#e39ab6;--savory:#c99a4a;--bitter:#5f9a6a;--umami:#8b79c4}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#tiles{position:absolute;inset:0;overflow:hidden;opacity:.8}#tiles img{position:absolute;transform-origin:0 0;max-width:none}
#s,#c{position:absolute;inset:0;width:100%;height:100%}#c{pointer-events:none}
.hex{stroke:#0d1115;stroke-width:.6;vector-effect:non-scaling-stroke}
.hex.on{stroke:#fff;stroke-width:1.6}
.lab{font:600 9px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:#c9ccd0;paint-order:stroke;stroke:#0d1115;stroke-width:2.5px;text-anchor:middle;pointer-events:none}
.sig{font:italic 600 11px Georgia,serif;fill:#fff;paint-order:stroke;stroke:#0d1115;stroke-width:2.5px;text-anchor:middle;pointer-events:none}
#card{position:absolute;left:20px;top:20px;width:300px;background:rgba(13,17,21,.94);border:1px solid #cfc9bd;padding:16px 18px 14px}
#card h1{font:700 26px/1 Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
#card p{font-size:12px;line-height:1.45;color:#b9bec4;margin:0 0 12px}
.k{display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:11px;align-items:baseline;margin-bottom:12px}
.k b{font:700 11px Georgia,serif;letter-spacing:.12em;text-transform:uppercase}.k span{color:var(--mute)}
.sec{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:10px 0 5px;border-top:1px solid #2a3139;padding-top:8px}
.ramp{height:8px;background:linear-gradient(90deg,rgba(201,154,74,.28),rgba(201,154,74,.94))}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:3px}
.row{display:flex;align-items:center;gap:8px;font-size:11px;color:#b9bec4;margin:4px 0}
.src{font-size:9.5px;color:#6c747d;margin-top:10px;line-height:1.4}
#tip{position:absolute;pointer-events:none;display:none;min-width:210px;max-width:250px;background:#0d1115;border:1px solid #e9e4da;padding:10px 12px;font-size:11px;z-index:5}
#tip .n{font:700 14px Georgia,serif;margin-bottom:2px}#tip .m{font:800 22px Inter,sans-serif;line-height:1.1;margin:2px 0 8px}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}#tip dt{color:var(--mute)}#tip dd{margin:0;text-align:right}
#tip .bar{display:flex;height:5px;margin:8px 0 0}
@media(max-width:640px){#card{width:calc(100% - 24px);left:12px;top:12px;max-height:44vh;overflow:auto}}

body::after{content:"";position:fixed;inset:10px;border:1px solid #cfc9bd;box-shadow:inset 0 0 0 4px #0d1115,inset 0 0 0 5px #6f6a60;pointer-events:none;z-index:4}
#card{left:26px;top:26px;width:310px;padding:18px 20px 14px;background:rgba(13,17,21,.95);border:1px solid #cfc9bd;box-shadow:5px 5px 0 rgba(0,0,0,.45)}
#card .eye{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.28em;text-transform:uppercase;color:#c99a4a;margin-bottom:6px}
#card h1{font:800 31px/.98 'Playfair Display',Georgia,serif;letter-spacing:-.01em}#card h1 i{font-weight:500;color:#e9e4da}
#card .rule{height:5px;border-top:1px solid #cfc9bd;border-bottom:1px solid #cfc9bd;margin:10px 0}
#card p,.src,.rl,.row,.sec{font-family:'IBM Plex Mono',monospace}#card p{font-size:10.5px;line-height:1.55}
.menu{margin:0 0 4px}.mi{display:flex;align-items:center;gap:7px;margin:5px 0;font:500 10px 'IBM Plex Mono',monospace;color:#8d96a0}
.mi b{font:600 13px 'Playfair Display',serif;letter-spacing:.14em;text-transform:uppercase;width:64px}
.mi em{flex:1;border-bottom:1px dotted #4a525b;height:1px;min-width:8px;margin-top:4px}.mi span{text-align:right;color:#b9bec4}
#tip dt,#tip dd,#tip .m{font-family:'IBM Plex Mono',monospace}#tip .m{font-weight:500}
.lab,.sig{font-family:'IBM Plex Mono',monospace}
@media(max-width:640px){body::after{inset:5px}#card{left:14px;top:14px}}
*,.sig,.lab,#tip .m,#tip .n,.mi b,#card h1,#card h1 i{font-style:normal!important;font-weight:500!important}
</style></head><body>
<div id="tiles"></div>
<svg id="s"><g id="z"><g id="base"></g><g id="city"></g><g id="hexes"></g><g id="sigs"></g><g id="hoods"></g></g></svg>
<canvas id="c"></canvas>
<div id="card">
<div class="eye">Five flavors</div>
<h1>The Portland <i>Palate</i></h1><div class="rule"></div>
<p>Each place adds points to one flavor. Hexagons take the highest-scoring colour.</p>
<div class="menu"><div class="mi"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,4 14,12 7,16 0,12 0,4" fill="#d4492c"/></svg><b style="color:#d4492c">Spicy</b><em></em><span>Thai · Mexican</span></div><div class="mi"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,4 14,12 7,16 0,12 0,4" fill="#e39ab6"/></svg><b style="color:#e39ab6">Sweet</b><em></em><span>Bakeries</span></div><div class="mi"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,4 14,12 7,16 0,12 0,4" fill="#c99a4a"/></svg><b style="color:#c99a4a">Savory</b><em></em><span>Burgers · pizza</span></div><div class="mi"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,4 14,12 7,16 0,12 0,4" fill="#5f9a6a"/></svg><b style="color:#5f9a6a">Bitter</b><em></em><span>Coffee · IPA</span></div><div class="mi"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,4 14,12 7,16 0,12 0,4" fill="#8b79c4"/></svg><b style="color:#8b79c4">Umami</b><em></em><span>Ramen · sushi</span></div></div><div class="sec">Margin</div>
<div class="ramp"></div><div class="rl"><span>narrow</span><span>wide</span></div>
<div class="sec">Symbols</div>
<div class="row"><svg width="46" height="22"><rect x="2" y="5" width="40" height="12" fill="#f4ecd8" fill-opacity=".12" stroke="#f4ecd8" stroke-dasharray="4 2"/></svg>Scored area</div>
<div class="row"><svg width="46" height="22"><polygon points="8,3 14,6.5 14,13.5 8,17 2,13.5 2,6.5" fill="#777"/><polygon points="32,0 42,5.5 42,16.5 32,22 22,16.5 22,5.5" fill="#777"/></svg>Size = places</div>
<div class="src" id="src"></div>
</div>
<div id="tip"></div>
<script>
const FC=['#d4492c','#e39ab6','#c99a4a','#5f9a6a','#8b79c4'],FN=['Spicy','Sweet','Savory','Bitter','Umami'];
d3.json('data/portland.json').then(D=>{
const W=()=>innerWidth,H=()=>innerHeight;
const hx=D.hexes,pts=D.pts,R=D.R;
document.getElementById('src').innerHTML=pts.length.toLocaleString()+' places · OpenStreetMap · Esri';
const maxN=d3.max(hx,h=>h[2]);[...hx].sort((a,b)=>b[2]-a[2]).forEach((h,i)=>h.rank=i);
hx.forEach(h=>{const o=h[3].map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]),tot=d3.sum(h[3]);h.dom=o[0][1];h.gap=o[0][0]-o[1][0];h.str=Math.min(1,h.gap/tot*2.2)});
const proj=d3.geoMercator();
const svg=d3.select('#s'),z=d3.select('#z'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let T=d3.zoomIdentity,hexG,P=[];
const tip=document.getElementById('tip');
const mpl=111320*Math.cos(D.lat0*Math.PI/180);
const scale=h=>Math.min(1.12,.62+.8*Math.sqrt(h[2]/maxN));
function hexPath(h,s){const[cx,cy]=proj([h[0],h[1]]);
 const r=R*Math.abs(proj([h[0]+1/mpl,h[1]])[0]-cx)*s;
 return 'M'+d3.range(6).map(i=>{const a=Math.PI/180*(60*i-30);return[cx+r*Math.cos(a),cy+r*Math.sin(a)].map(v=>v.toFixed(1)).join(',')}).join('L')+'Z'}
const HOODS=new Set(['Pearl District','Alberta Arts District','Hawthorne','Division','Mississippi','Old Town','Sellwood','St. Johns','Lloyd District','Buckman','Hollywood','Montavilla','Kerns','Woodstock','Foster-Powell','Nob Hill','Goose Hollow','Downtown','Eliot','Irvington','Laurelhurst','Richmond','Kenton','Lents','Cully','Beaumont','Brooklyn']);
const MAJOR=new Set(['Pearl District','Alberta Arts District','Hawthorne','Division','Mississippi','Downtown','Sellwood','St. Johns']);
function draw(){
 proj.fitExtent([[340,40],[W()-30,H()-30]],{type:'MultiPoint',coordinates:D.boundary.flat()});
 P=pts.map(p=>proj([p[0],p[1]]));
 const line=c=>'M'+c.map(q=>proj(q).map(v=>v.toFixed(1)).join(',')).join('L'),base=d3.select('#base').html('');
 D.water.forEach(w=>{const closed=w.length>3&&w[0][0]==w.at(-1)[0]&&w[0][1]==w.at(-1)[1];
  base.append('path').attr('d',line(w)+(closed?'Z':'')).attr('fill',closed?'var(--water)':'none').attr('stroke','#34506b').attr('stroke-width',closed?.6:1.4).attr('opacity',.25)});
 d3.select('#city').html('').selectAll('path').data(D.boundary).join('path').attr('d',r=>line(r)+'Z').attr('fill','#f4ecd8').attr('fill-opacity',.06).attr('stroke','#f4ecd8').attr('stroke-width',1.4).attr('stroke-dasharray','5 3').attr('vector-effect','non-scaling-stroke').attr('pointer-events','none');
 hexG=d3.select('#hexes').html('').selectAll('g').data(hx).join('g');
 hexG.append('path').attr('class','hex').attr('d',h=>hexPath(h,scale(h))).attr('fill',h=>FC[h.dom])
  .on('mousemove',(e,h)=>show(e,hexTip(h))).on('mouseenter',function(){d3.select(this).classed('on',1)}).on('mouseleave',function(){d3.select(this).classed('on',0);hide()});
 const hd=d3.select('#hoods').html('');
 D.hoods.forEach(n=>{const[x,y]=proj([n[0],n[1]]);hd.append('text').attr('class','lab').attr('x',x).attr('y',y).text(n[2])});
 apply();
}
function apply(){
 const k=T.k,sk=Math.sqrt(k);
 hexG.select('.hex').attr('fill-opacity',h=>(.3+.64*h.str)*(k<2?1:k<4?1-.55*(k-2)/2:.45));
 d3.selectAll('.lab').style('display',function(){const t=this.textContent;return k>=6||(k>=4&&HOODS.has(t))||(k>=2.5&&MAJOR.has(t))?null:'none'}).style('font-size',9/sk+'px').style('stroke-width',2.5/sk+'px');
 tiles();dots();
}
const tl=new Map();
function tiles(){
 const sc=proj.scale(),t=proj.translate(),k=T.k,wp=2*Math.PI*sc*k;
 const z=Math.max(0,Math.min(16,Math.floor(Math.log2(wp/256)+.5))),n=2**z,ts=wp/n;
 const x0=T.x+k*(t[0]-Math.PI*sc),y0=T.y+k*(t[1]-Math.PI*sc),want=new Set();
 for(let i=Math.max(0,Math.floor(-x0/ts));i<=Math.min(n-1,Math.floor((W()-x0)/ts));i++)
  for(let j=Math.max(0,Math.floor(-y0/ts));j<=Math.min(n-1,Math.floor((H()-y0)/ts));j++){
   const id=z+'/'+i+'/'+j;want.add(id);let im=tl.get(id);
   if(!im){im=new Image();im.src=`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${z}/${j}/${i}`;document.getElementById('tiles').appendChild(im);tl.set(id,im)}
   im.style.width=im.style.height=ts+.5+'px';im.style.left=x0+i*ts+'px';im.style.top=y0+j*ts+'px'}
 for(const[id,im]of tl)if(!want.has(id)&&(tl.size>150||+id.split('/')[0]!==z)){im.remove();tl.delete(id)}
}
function dots(){
 const dpr=devicePixelRatio||1;cv.width=W()*dpr;cv.height=H()*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W(),H());
 const k=T.k;if(k<1.6)return;
 const r=d3.scaleLinear().domain([1.6,4,10,24]).range([.8,1.8,3.4,6]).clamp(true)(k),a=k<3?.55:.9,vis=[];
 pts.forEach((p,i)=>{const[x,y]=T.apply(P[i]);if(x<-9||y<-9||x>W()+9||y>H()+9)return;vis.push([p,x,y]);
  ctx.globalAlpha=a;ctx.fillStyle=FC[p[4]];ctx.beginPath();ctx.arc(x,y,r*(.8+p[8]*.2),0,7);ctx.fill();
  if(k>8&&p[5]>=3){ctx.globalAlpha=.9;ctx.strokeStyle='#f4ecd8';ctx.lineWidth=1;ctx.stroke()}});
 if(k>12){ctx.globalAlpha=1;ctx.font='600 10px Inter,sans-serif';ctx.textAlign='left';ctx.lineWidth=3;ctx.strokeStyle='#0d1115';ctx.fillStyle='#e9e4da';
  vis.forEach(([p,x,y])=>{ctx.strokeText(p[2],x+r+4,y+3);ctx.fillText(p[2],x+r+4,y+3)})}
}
const bars=m=>'<div class="bar">'+m.map((v,i)=>`<i style="flex:${v};background:${FC[i]}"></i>`).join('')+'</div>';
const cap=s=>s[0].toUpperCase()+s.slice(1);
function hexTip(h){return `<div class="n">${h[5][0]?cap(h[5][0])+' quarter':'Mixed quarter'}</div>
 <div class="m" style="color:${FC[h.dom]}">${h.gap<.01?'Tied':FN[h.dom]+' +'+h.gap.toFixed(1)}</div>
 <dl><dt>Places</dt><dd>${h[2]}</dd><dt>Score</dt><dd>${h[3].map((c,i)=>`<span style="color:${FC[i]}">${c}</span>`).join(' · ')}</dd><dt>Spice level</dt><dd>${h[4].toFixed(1)} / 5</dd><dt>Signature</dt><dd>${h[5].join(', ')||'—'}</dd><dt>Seen at</dt><dd>${h[6].join('; ')}</dd></dl>${bars(h[3])}`}
const dotTip=p=>`<div class="n">${p[2]}</div><div class="m" style="color:${FC[p[4]]}">${FN[p[4]]}</div>
 <dl><dt>Kind</dt><dd>${p[3]}</dd><dt>Venue</dt><dd>${p[6]}</dd><dt>Spice level</dt><dd>${p[5].toFixed(1)} / 5</dd><dt>Score</dt><dd>${p[8].toFixed(1)}</dd></dl>`;
function show(e,html){tip.innerHTML=html;tip.style.display='block';tip.style.left=Math.min(e.clientX+16,W()-tip.offsetWidth-8)+'px';tip.style.top=Math.min(e.clientY+16,H()-tip.offsetHeight-8)+'px'}
function hide(){tip.style.display='none'}
svg.call(d3.zoom().scaleExtent([1,40]).on('zoom',e=>{T=e.transform;z.attr('transform',T);apply()}));
svg.on('mousemove.dot',e=>{if(T.k<5)return;let best=null,bd=100;
 pts.forEach((p,i)=>{const[x,y]=T.apply(P[i]),d=(x-e.clientX)**2+(y-e.clientY)**2;if(d<bd){bd=d;best=p}});
 best?show(e,dotTip(best)):hide()});
addEventListener('resize',draw);
draw();
});
</script></body></html>
