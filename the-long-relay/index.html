<meta charset="utf-8">
<title>The Long Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#B4C0D6;
    --panel:#A8B5CC;
    --panel-glass:rgba(184,196,217,0.86);
    --land:#4C6488;
    --land-line:#33455F;
    --ink:#141A24;
    --ink-soft:#3C4A60;
    --ink-faint:#5E6C82;
    --line:rgba(20,26,36,0.18);
    --panel-border:rgba(20,26,36,0.16);
    --shadow:0 18px 40px -20px rgba(10,14,20,0.45);
    --focus:#B8892A;

    --cat-ideas:#B8892A;
    --cat-tools:#8A3B22;
    --cat-food:#7A2038;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1420;
      --panel:#121A28;
      --panel-glass:rgba(15,21,33,0.82);
      --land:#233149;
      --land-line:#3B5074;
      --ink:#DCE3EE;
      --ink-soft:#96A5BC;
      --ink-faint:#616F87;
      --line:rgba(220,227,238,0.15);
      --panel-border:rgba(220,227,238,0.15);
      --shadow:0 18px 40px -20px rgba(0,0,0,0.6);
      --focus:#E8C55A;

      --cat-ideas:#E8C55A;
      --cat-tools:#DD8256;
      --cat-food:#C85E78;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1420;
    --panel:#121A28;
    --panel-glass:rgba(15,21,33,0.82);
    --land:#233149;
    --land-line:#3B5074;
    --ink:#DCE3EE;
    --ink-soft:#96A5BC;
    --ink-faint:#616F87;
    --line:rgba(220,227,238,0.15);
    --panel-border:rgba(220,227,238,0.15);
    --shadow:0 18px 40px -20px rgba(0,0,0,0.6);
    --focus:#E8C55A;

    --cat-ideas:#E8C55A;
    --cat-tools:#DD8256;
    --cat-food:#C85E78;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{height:100%;}
  body{
    height:100vh; height:100dvh; overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"Lato", "Helvetica Neue", Arial, sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  @media (max-width:760px){ body{ height:auto; min-height:100vh; min-height:100dvh; overflow:visible; } }

  a{ color:var(--focus); }

  /* ---------- full-bleed map frame -- the whole page IS the map ---------- */
  .map-frame{
    position:fixed; inset:0;
    width:100vw; height:100vh; height:100dvh;
    background:var(--bg);
    overflow:hidden;
  }
  @media (max-width:760px){ .map-frame{ position:relative; height:100vh; height:100dvh; } }

  .map-viewport{ position:relative; width:100%; height:100%; overflow:hidden; }
  .map-viewport svg{ display:block; width:100%; height:100%; }

  .land{ fill:var(--land); stroke:var(--land-line); stroke-width:0.4; stroke-linejoin:round; }

  .route{ fill:none; stroke:var(--ink); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; opacity:0.7; }

  .origin{ cursor:pointer; }
  .origin-hit{ fill:transparent; }
  .origin-halo{ fill:var(--bg); }
  .origin-photo{ pointer-events:none; }
  .origin-ring{ fill:none; stroke-width:2.2px; }
  .origin-ring.cat-ideas{ stroke:var(--cat-ideas); }
  .origin-ring.cat-tools{ stroke:var(--cat-tools); }
  .origin-ring.cat-food{ stroke:var(--cat-food); }
  .origin:hover .origin-ring, .origin:focus-visible .origin-ring{ stroke:var(--focus); stroke-width:2.8px; }
  .origin:hover .origin-photo, .origin:focus-visible .origin-photo{ opacity:0.88; }
  .origin:focus-visible{ outline:none; }
  .origin-badge-num{ paint-order:stroke fill; stroke:var(--bg); stroke-width:1.6px; }
  .origin-badge-num.cat-ideas{ fill:var(--cat-ideas); }
  .origin-badge-num.cat-tools{ fill:var(--cat-tools); }
  .origin-badge-num.cat-food{ fill:var(--cat-food); }
  .origin-num{
    font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-weight:600; font-size:6.6px;
    fill:var(--bg); pointer-events:none;
  }
  .origin-label{ display:none; } /* superseded by the always-on .origin-blurb card */
  .halo{ paint-order:stroke fill; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; }

  /* ---------- floating glass panels ---------- */
  .glass{
    background:var(--panel-glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid var(--panel-border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }

  .ov-header{
    position:absolute; z-index:5; top:20px; left:20px;
    max-width:min(400px, calc(100vw - 40px));
    padding:18px 22px;
  }
  .ov-header h1{
    font-family:"Lato", "Helvetica Neue", Arial, sans-serif;
    font-weight:700; letter-spacing:-0.01em;
    font-size:clamp(1.4rem,2.6vw,2rem);
    line-height:1.02; margin:0 0 8px; text-wrap:balance;
  }
  .ov-header .dek{ margin:0; font-size:0.86rem; color:var(--ink-soft); }



  .map-credit{
    position:absolute; z-index:5; right:16px; bottom:10px;
    font-size:0.62rem; color:var(--ink-faint); text-align:right;
  }
  .map-credit a{ color:inherit; text-decoration:underline; text-decoration-color:var(--panel-border); }
  @media (max-width:760px){
    .ov-header{ max-width:calc(100vw - 40px); }
    .map-credit{ display:none; }
  }

  /* ---------- popup ---------- */
  .popup{
    position:fixed; z-index:50;
    width:min(280px, 84vw);
    overflow:hidden;
    border-top:4px solid var(--ink-faint);
  }
  .popup[hidden]{ display:none; }
  .popup.cat-ideas{ border-top-color:var(--cat-ideas); }
  .popup.cat-tools{ border-top-color:var(--cat-tools); }
  .popup.cat-food{ border-top-color:var(--cat-food); }
  .popup-img{ width:100%; height:140px; object-fit:cover; display:block; background:var(--land); }
  .popup-close{
    position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.4); color:#fff; font-size:15px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .popup-body{ padding:12px 15px 14px; }
  .popup-name{ margin:0 0 3px; font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-weight:700; font-size:1rem; }
  .popup-meta{
    margin:0 0 7px; font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-size:0.64rem;
    letter-spacing:0.03em; color:var(--ink-faint); text-transform:uppercase;
  }
  .popup-note{ margin:0 0 6px; font-size:0.82rem; color:var(--ink-soft); line-height:1.4; }
  ul.popup-routes{
    list-style:none; margin:0 0 8px; padding:8px 0 0;
    border-top:1px dashed var(--line);
    display:flex; flex-direction:column; gap:4px; max-height:140px; overflow-y:auto;
  }
  ul.popup-routes li{ font-size:0.72rem; color:var(--ink-faint); line-height:1.35; }
  .popup-route-place{ color:var(--ink-soft); font-weight:600; }
  .popup-route-year{ font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-size:0.66rem; margin-left:4px; }
  .popup-route-year::before{ content:"("; }
  .popup-route-year::after{ content:")"; }
  .popup-credit{ margin:0; font-size:0.64rem; color:var(--ink-faint); font-style:italic; }

  /* ---------- always-on blurb next to each point, so the whole map reads
     on its own as one static piece, with no click required ---------- */
  #leaders{ position:fixed; inset:0; width:100vw; height:100vh; z-index:3; pointer-events:none; }
  #leaders line{ stroke:var(--ink-soft); stroke-width:1.1; stroke-dasharray:3 3; stroke-linecap:round; }
  .origin-blurb{
    position:fixed; z-index:4;
    display:flex; gap:9px; align-items:flex-start;
    width:240px;
    background:var(--panel-glass);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);
    backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--panel-border);
    border-top:3px solid var(--ink-faint);
    border-radius:8px;
    padding:6px 9px 7px;
    box-shadow:0 8px 18px -10px rgba(10,14,20,0.5);
    pointer-events:none;
  }
  .origin-blurb.thumb-right{ flex-direction:row-reverse; }
  .origin-blurb .ob-thumb{ flex:0 0 auto; width:58px; height:58px; object-fit:cover; border-radius:6px; border:1px solid var(--panel-border); }
  .origin-blurb .ob-text{ min-width:0; flex:1 1 auto; }
  .origin-blurb.cat-ideas{ border-top-color:var(--cat-ideas); }
  .origin-blurb.cat-tools{ border-top-color:var(--cat-tools); }
  .origin-blurb.cat-food{ border-top-color:var(--cat-food); }
  .origin-blurb .ob-name{ font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-weight:700; font-size:12.5px; line-height:1.2; color:var(--ink); }
  .origin-blurb .ob-place{
    font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-size:9px; letter-spacing:0.03em;
    color:var(--ink-faint); margin-top:2px;
  }
  .origin-blurb .ob-note{ font-family:"Lato", "Helvetica Neue", Arial, sans-serif; font-size:10px; line-height:1.32; color:var(--ink-soft); margin-top:3px; }
  @media (max-width:1500px){
    .origin-blurb{ width:214px; padding:5px 8px 6px; }
    .origin-blurb .ob-note{ font-size:9px; line-height:1.25; -webkit-line-clamp:3; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
  }
  @media (max-width:1100px){
    .origin-blurb{ width:170px; padding:5px 7px 6px; }
    .origin-blurb .ob-thumb{ width:44px; height:44px; }
    .origin-blurb .ob-note{ display:none; }
  }
</style>

  var POINTS = [{"n": 1, "cat": "ideas", "x": 902.56, "y": 206.72, "name": "Cuneiform writing", "place": "Mesopotamia", "country": "Iraq", "era": "c. 3400 BCE", "note": "Marks pressed into wet clay with a reed, the first script strong enough to hold a debt, a treaty or a law long after everyone who agreed to it was gone.", "img": "img/cuneiform.jpg", "img_credit": "Xerxes cuneiform inscription, Van Fortress, Turkey", "dir": "top-right", "routes": [{"place": "Egypt", "label": "Pharaohs and Near Eastern kings trade letters in cuneiform Akkadian, the Amarna archive", "year": "c. 1350 BCE"}]}, {"n": 2, "cat": "tools", "x": 845.0, "y": 212.6, "name": "Papyrus", "place": "Egypt", "country": "Egypt", "era": "c. 3000 BCE", "note": "A reed of the Nile delta, sliced, pressed and dried into the ancient world's paper. It became Egypt's chief export to every literate power on the Mediterranean.", "img": "img/papyrus.jpg", "img_credit": "Papyrus reed, Cyperus papyrus", "dir": "bottom-right", "routes": [{"place": "Greece", "label": "papyrus imported wholesale for Greek scrolls and archives", "year": "by the 7th century BCE"}, {"place": "Italy", "label": "the Roman state runs its empire on Egyptian papyrus", "year": "after 30 BCE"}]}, {"n": 3, "cat": "ideas", "x": 814.92, "y": 180.08, "name": "Democracy", "place": "Athens", "country": "Greece", "era": "c. 508 BCE", "note": "Cleisthenes hands ordinary citizens a vote. The idea proved so combustible that it has been reinvented, argued over and half copied for the next 2,500 years.", "img": "img/democracy.png", "img_credit": "Pericles' funeral oration, painted by Philipp Foltz", "dir": "top-right", "routes": [{"place": "Italy", "label": "Rome sends envoys to study Athenian law before the Twelve Tables, per Livy", "year": "c. 451 BCE"}]}, {"n": 4, "cat": "tools", "x": 1155.8, "y": 194.92, "name": "Gunpowder", "place": "China", "country": "China", "era": "9th century CE", "note": "Alchemists hunting for an elixir of immortality mixed charcoal, sulfur and saltpeter and got an explosion instead. Within four centuries it had ended the age of the castle wall.", "img": "img/gunpowder.jpg", "img_credit": "Black powder: charcoal, sulfur, and saltpeter", "dir": "top-right", "routes": [{"place": "Iraq", "label": "Mongol armies bring Chinese siege engineers west to Baghdad", "year": "by 1258"}, {"place": "Italy", "label": "Florence commissions cannon and iron shot, the first European record", "year": "1326"}]}, {"n": 5, "cat": "tools", "x": 770.0, "y": 164.4, "name": "Concrete", "place": "Rome", "country": "Italy", "era": "from c. 200 BCE", "note": "Volcanic ash, lime and seawater cure into a stone that pours. It let one empire build roads, domes and harbors on three continents at once.", "img": "img/concrete.jpg", "img_credit": "The Pantheon's coffered concrete dome, Rome", "dir": "top-right", "routes": [{"place": "Greece", "label": "Corinth is refounded as a Roman colony and rebuilt in Roman style", "year": "44 BCE"}]}, {"n": 6, "cat": "food", "x": 864.68, "y": 302.92, "name": "Coffee", "place": "the Kaffa highlands", "country": "Ethiopia", "era": "discovered c. 850 CE", "note": "A shepherd notices his goats will not sleep after eating a certain berry. A thousand years later, half the planet starts its morning the same way.", "img": "img/coffee.jpg", "img_credit": "Brewed coffee, descended from the Kaffa highland shrub", "dir": "bottom-right", "routes": [{"place": "Egypt", "label": "coffeehouses open in Cairo", "year": "by c. 1510"}, {"place": "Italy", "label": "Venice opens its first cafe", "year": "1645"}]}, {"n": 7, "cat": "tools", "x": 230.32, "y": 180.92, "name": "Denim jeans", "place": "San Francisco", "country": "United States", "era": "1873 CE", "note": "Tailor Jacob Davis and merchant Levi Strauss patent copper rivets on work pants. A miner's garment ends up worn on every continent.", "img": "img/jeans.jpg", "img_credit": "A pair of blue jeans", "dir": "top-right", "routes": [{"place": "Italy", "label": "American GIs stationed in Europe make jeans a Continental fashion", "year": "from 1945"}, {"place": "China", "label": "Levi's opens for business in China", "year": "1985"}]}];
  var byN = {};
  POINTS.forEach(function(p){ byN[p.n] = p; });

  var svg = document.querySelector('.map-viewport svg');
  var popup = document.getElementById('popup');
  var popupImg = document.getElementById('popupImg');
  var popupName = document.getElementById('popupName');
  var popupMeta = document.getElementById('popupMeta');
  var popupNote = document.getElementById('popupNote');
  var popupRoutes = document.getElementById('popupRoutes');
  var popupCredit = document.getElementById('popupCredit');
  var popupClose = document.getElementById('popupClose');
  var activeN = null;

  function svgToScreen(x, y){
    var pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    var m = svg.getScreenCTM();
    return pt.matrixTransform(m);
  }

  function positionPopup(p){
    var pt = svgToScreen(p.x, p.y);
    var margin = 16;
    var pw = popup.offsetWidth || 280, ph = popup.offsetHeight || 220;
    var left = pt.x + 18;
    var top = pt.y - ph / 2;
    var maxLeft = window.innerWidth - pw - margin;
    if (left > maxLeft) left = pt.x - pw - 18;
    if (left < margin) left = margin;
    if (top < margin) top = margin;
    if (top + ph > window.innerHeight - margin) top = window.innerHeight - ph - margin;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function showPopup(n){
    var p = byN[n];
    if (!p) return;
    activeN = n;
    popup.classList.remove('cat-ideas', 'cat-tools', 'cat-food');
    popup.classList.add('cat-' + p.cat);
    popupImg.src = p.img;
    popupImg.alt = p.img_credit;
    popupName.textContent = p.n + '. ' + p.name;
    popupMeta.textContent = (p.country && p.country !== p.place ? p.place + ', ' + p.country : p.place) + ' \u00b7 ' + p.era;
    popupNote.textContent = p.note;
    popupRoutes.innerHTML = (p.routes || []).map(function(r){
      return '<li><span class="popup-route-place">' + r.place + '</span>' +
        '<span class="popup-route-year">' + r.year + '</span>: ' + r.label + '</li>';
    }).join('');
    popupCredit.textContent = p.img_credit;
    popup.hidden = false;
    positionPopup(p);
  }

  function hidePopup(){
    popup.hidden = true;
    activeN = null;
  }

  document.querySelectorAll('.origin').forEach(function(g){
    var n = g.getAttribute('data-n');
    g.addEventListener('click', function(e){
      e.stopPropagation();
      if (activeN === n) hidePopup(); else showPopup(n);
    });
    g.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPopup(n); }
    });
  });

  popupClose.addEventListener('click', function(e){ e.stopPropagation(); hidePopup(); });
  popup.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('click', function(){ if (!popup.hidden) hidePopup(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hidePopup(); });
  window.addEventListener('resize', function(){ if (activeN !== null) positionPopup(byN[activeN]); });

  /* ---- always-on blurb beside every point, so the map reads on its own,
     with the same 8-direction + multi-pass collision relaxation used for
     the Balkan roadtrip map's on-map cards ---- */
  var DIR_CYCLE2 = ["top","top-right","right","bottom-right","bottom","bottom-left","left","top-left"];
  var DIR_VEC = {
    top:[0,-1], "top-right":[1,-1], right:[1,0], "bottom-right":[1,1],
    bottom:[0,1], "bottom-left":[-1,1], left:[-1,0], "top-left":[-1,-1]
  };
  function rectsOverlap2(a,b){ return !(a.right<=b.left||a.left>=b.right||a.bottom<=b.top||a.top>=b.bottom); }

  var blurbContainer = document.getElementById('originBlurbs');
  var blurbEls = POINTS.map(function(p){
    var el = document.createElement('div');
    el.className = 'origin-blurb cat-' + p.cat;
    el.innerHTML =
      '<img class="ob-thumb" src="' + p.img + '" alt="' + p.img_credit + '">' +
      '<div class="ob-text">' +
        '<div class="ob-name">' + p.n + '. ' + p.name + '</div>' +
        '<div class="ob-place">' + (p.country && p.country !== p.place ? p.place + ', ' + p.country : p.place) + ' · ' + p.era + '</div>' +
        '<div class="ob-note">' + p.note + '</div>' +
      '</div>';
    blurbContainer.appendChild(el);
    return el;
  });

  var GAP_TIERS = [20, 45, 75, 115, 165]; // escalate distance from the point when closer tiers can't clear a crowd
  function placeBlurbAt(el, anchorPx, dir, gap){
    var w = el.offsetWidth, h = el.offsetHeight;
    var vec = DIR_VEC[dir];
    el.classList.toggle('thumb-right', vec[0] < 0);
    var left = vec[0] < 0 ? anchorPx.x - gap - w : vec[0] > 0 ? anchorPx.x + gap : anchorPx.x - w / 2;
    var top = vec[1] < 0 ? anchorPx.y - gap - h : vec[1] > 0 ? anchorPx.y + gap : anchorPx.y - h / 2;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    return el.getBoundingClientRect();
  }

  function resolveOriginBlurbs(){
    var anchors = POINTS.map(function(p){ return svgToScreen(p.x, p.y); });
    // fixed chrome (header/stats/sidebar) is weighted far heavier than a
    // card-card touch: two info cards brushing is dense but readable,
    // a card overlapping the app's own UI chrome looks broken
    var obstacles = [document.querySelector('.ov-header')]
      .filter(function(el){ return el && getComputedStyle(el).display !== 'none'; })
      .map(function(el){ return {rect: el.getBoundingClientRect(), weight: 8}; });
    Array.prototype.forEach.call(document.querySelectorAll('.origin-halo'), function(el){
      obstacles.push({rect: el.getBoundingClientRect(), weight: 8});
    });
    var EDGE = 10000; // off-screen "walls" so a card is never pushed past the viewport edge
    var vw = window.innerWidth, vh = window.innerHeight;
    [
      {left:-EDGE, right:0, top:-EDGE, bottom:vh+EDGE},        // left wall
      {left:vw, right:vw+EDGE, top:-EDGE, bottom:vh+EDGE},     // right wall
      {left:-EDGE, right:vw+EDGE, top:-EDGE, bottom:0},        // top wall
      {left:-EDGE, right:vw+EDGE, top:vh, bottom:vh+EDGE}      // bottom wall
    ].forEach(function(rect){ obstacles.push({rect: rect, weight: 8}); });

    // candidates ordered so nearer tiers are always preferred over farther
    // ones, and within a tier the element's own current direction is tried
    // first -- only reach for a bigger gap once every direction at closer
    // tiers has been exhausted
    var curDir = POINTS.map(function(p){ return p.dir; });
    var curGapIdx = POINTS.map(function(){ return 0; });

    for(var pass=0; pass<20; pass++){
      var indices = [];
      for(var x=0;x<blurbEls.length;x++) indices.push(x);
      if(pass % 2 === 1) indices.reverse(); // alternate order each pass to avoid order-bias local minima
      for(var ii=0; ii<indices.length; ii++){
        var i = indices[ii];
        var el = blurbEls[i];
        var others = obstacles.concat(
          blurbEls.filter(function(_, j){ return j !== i; }).map(function(o){ return {rect: o.getBoundingClientRect(), weight: 1}; })
        );
        var startIdx = DIR_CYCLE2.indexOf(curDir[i]);
        var dirOrder = DIR_CYCLE2.slice(startIdx).concat(DIR_CYCLE2.slice(0, startIdx));
        var bestDir = dirOrder[0], bestGapIdx = 0, bestOverlap = Infinity, found = false;
        for(var g=0; g<GAP_TIERS.length && !found; g++){
          for(var k=0;k<dirOrder.length;k++){
            var r = placeBlurbAt(el, anchors[i], dirOrder[k], GAP_TIERS[g]);
            var overlapScore = others.reduce(function(sum, o){ return rectsOverlap2(r, o.rect) ? sum + o.weight : sum; }, 0);
            if(overlapScore < bestOverlap){ bestOverlap = overlapScore; bestDir = dirOrder[k]; bestGapIdx = g; }
            if(overlapScore === 0){ found = true; break; }
          }
        }
        curDir[i] = bestDir;
        curGapIdx[i] = bestGapIdx;
        placeBlurbAt(el, anchors[i], bestDir, GAP_TIERS[bestGapIdx]);
      }
    }
    drawLeaders(anchors);
  }

  var leaders = document.getElementById('leaders');
  function drawLeaders(anchors){
    var halos = document.querySelectorAll('.origin-halo');
    leaders.innerHTML = '';
    blurbEls.forEach(function(el, i){
      var r = el.getBoundingClientRect(), a = anchors[i];
      var tx = Math.min(Math.max(a.x, r.left), r.right), ty = Math.min(Math.max(a.y, r.top), r.bottom);
      var dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
      if (!d) return;
      var rad = halos[i].getBoundingClientRect().width / 2; // start at the marker's edge, not its centre
      var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', a.x + dx / d * rad); ln.setAttribute('y1', a.y + dy / d * rad);
      ln.setAttribute('x2', tx); ln.setAttribute('y2', ty);
      leaders.appendChild(ln);
    });
  }

  resolveOriginBlurbs();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resolveOriginBlurbs);
  window.addEventListener('resize', function(){
    clearTimeout(window.__originBlurbT);
    window.__originBlurbT = setTimeout(resolveOriginBlurbs, 150);
  });
})();
</script>
